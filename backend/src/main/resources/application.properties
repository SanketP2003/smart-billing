spring.application.name=smart-billing
server.port=8082

# Database configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smartbilling}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:sanket}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Gemini API
gemini.api-key=${GEMINI_API_KEY:default-key-not-set}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Secret
jwt.secret=${JWT_SECRET:4f6a2b8e3d9c1f5a7b0d4e8f2c6a9b3d5e1f7c0a4b8d2e6f9c3a1b5d7e0f4c8}
jwt.expirationMs=86400000



